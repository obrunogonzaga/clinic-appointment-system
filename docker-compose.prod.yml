services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: clinic-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data_prod:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - clinic-internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Backend API - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: clinic-backend-prod
    restart: always
    expose:
      - "8000"
    environment:
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/
      - DATABASE_NAME=${MONGO_INITDB_DATABASE}
      - SECRET_KEY=${BACKEND_SECRET_KEY}
      - ENVIRONMENT=production
      - DEBUG=False
      - CORS_ORIGINS=["https://clinic.widia.io"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - clinic-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: clinic-frontend-prod
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clinic-internal
      - proxy
    labels:
      - "traefik.enable=true"
      # Router para HTTPS
      - "traefik.http.routers.clinic.rule=Host(`clinic.widia.io`)"
      - "traefik.http.routers.clinic.entrypoints=websecure"
      - "traefik.http.routers.clinic.tls.certresolver=letsencrypt"
      # Service
      - "traefik.http.services.clinic.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mongodb_data_prod:
    name: clinic-mongodb-data-prod

networks:
  clinic-internal:
    name: clinic-internal
    driver: bridge
  proxy:
    external: true
