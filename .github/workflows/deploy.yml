name: Deploy to Production Server

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/stacks/clinic-appointment

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            echo "📁 Navigating to deploy directory..."
            cd ${{ env.DEPLOY_PATH }}

            echo "📥 Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Building and starting containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "⏳ Waiting for services to be healthy..."
            sleep 30

            echo "🏥 Checking service health..."
            docker compose -f docker-compose.prod.yml ps

            echo "✅ Deployment completed!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Checking container status..."
            docker ps --filter "name=clinic" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "Checking frontend health..."
            curl -sf http://localhost:80/health -H "Host: clinic.widia.io" || echo "Frontend health check via localhost"

            echo ""
            echo "Checking external access..."
            curl -sf --max-time 10 https://clinic.widia.io/health || echo "External health check (may need DNS propagation)"

      - name: Notify on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "❌ Deployment failed! Checking logs..."
            cd ${{ env.DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml logs --tail=50
