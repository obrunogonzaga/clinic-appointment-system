x-default-env: &default-env
  env_file:
    - .env.coolify

services:
  mongodb:
    <<: *default-env
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - clinic-coolify-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    <<: *default-env
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"
      else
        redis-server --appendonly yes
      fi"
    volumes:
      - redis_data:/data
    networks:
      - clinic-coolify-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  minio:
    <<: *default-env
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - clinic-coolify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    <<: *default-env
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - clinic-coolify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    <<: *default-env
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - clinic-coolify-network
    command: python workers.py

  frontend:
    <<: *default-env
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clinic-coolify-network

volumes:
  mongodb_data:
    name: clinic-mongodb-data
  redis_data:
    name: clinic-redis-data
  minio_data:
    name: clinic-minio-data

networks:
  clinic-coolify-network:
    name: clinic-coolify-network
