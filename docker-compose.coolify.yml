x-default-env: &default-env
  env_file:
    - .env.coolify

services:
  mongodb:
    <<: *default-env
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    <<: *default-env
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"
      else
        redis-server --appendonly yes
      fi"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  minio:
    <<: *default-env
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio-setup:
    <<: *default-env
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: /bin/sh
    command: -c "
      set -euo pipefail;
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'Aguardando MinIO iniciar...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET_NAME};
      echo 'Bucket $${MINIO_BUCKET_NAME} criado com sucesso!';"

  postgres:
    <<: *default-env
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${CHATWOOT_DB_USER:-chatwoot}"]
      interval: 30s
      timeout: 10s
      retries: 5

  chatwoot:
    <<: *default-env
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    ports:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot_data:/app/storage
    environment:
      # Map Chatwoot-prefixed vars to Rails expected names
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      # PostgreSQL connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${CHATWOOT_DB_NAME:-chatwoot_production}
      POSTGRES_USERNAME: ${CHATWOOT_DB_USER:-chatwoot}
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      # Redis connection (use REDIS_URL from env which includes password if set)
      REDIS_URL: ${REDIS_URL}
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 5

  chatwoot-sidekiq:
    <<: *default-env
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot_data:/app/storage
    environment:
      # Map Chatwoot-prefixed vars to Rails expected names
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      # PostgreSQL connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${CHATWOOT_DB_NAME:-chatwoot_production}
      POSTGRES_USERNAME: ${CHATWOOT_DB_USER:-chatwoot}
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      # Redis connection (use REDIS_URL from env which includes password if set)
      REDIS_URL: ${REDIS_URL}
    command: bundle exec sidekiq -C config/sidekiq.yml

  backend:
    <<: *default-env
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    <<: *default-env
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: python workers.py

  frontend:
    <<: *default-env
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "80"
    environment:
      # Override BACKEND_URL to use internal service name for nginx proxy
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
    name: clinic-mongodb-data
  redis_data:
    name: clinic-redis-data
  minio_data:
    name: clinic-minio-data
  postgres_data:
    name: clinic-chatwoot-postgres-data
  chatwoot_data:
    name: clinic-chatwoot-data
