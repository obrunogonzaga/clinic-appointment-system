services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: clinic-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-clinic_db}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - clinic-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3 compatible object storage for patient documents
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: clinic-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./.env.local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - clinic-network

  # MinIO client bootstrap to create bucket and configure CORS
  minio-setup:
    image: minio/mc:latest
    container_name: clinic-minio-setup
    depends_on:
      - minio
    restart: "no"
    env_file:
      - ./.env.local
    entrypoint: /bin/sh
    command: -c "
      set -euo pipefail; \
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do \
        echo 'Aguardando MinIO iniciar...'; \
        sleep 2; \
      done; \
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-patient-docs}; \
      echo 'Bucket pronto. Configure o CORS pelo console do MinIO se necessário.'"
    networks:
      - clinic-network

  # Mongo Express - MongoDB Web Interface
  mongo-express:
    image: mongo-express:1.0.0
    container_name: clinic-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-changeme}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - clinic-network

  # Redis - Cache and Queue
  redis:
    image: redis:7-alpine
    container_name: clinic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - clinic-network
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"
      else
        redis-server --appendonly yes
      fi"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: clinic-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env
      - ./.env.local
    environment:
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongodb:27017/
      - DATABASE_NAME=${MONGO_INITDB_DATABASE:-clinic_db}
      - SECRET_KEY=${BACKEND_SECRET_KEY:-your-secret-key-here}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key-here-change-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ENVIRONMENT=development
      - DEBUG=True
    volumes:
      - ./backend:/app
      - backend_venv:/app/venv
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - clinic-network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Background Worker - ARQ
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: clinic-worker
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongodb:27017/
      - DATABASE_NAME=${MONGO_INITDB_DATABASE:-clinic_db}
      - SECRET_KEY=${BACKEND_SECRET_KEY:-your-secret-key-here}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ENVIRONMENT=development
      - DEBUG=True
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - ADDRESS_NORMALIZATION_ENABLED=${ADDRESS_NORMALIZATION_ENABLED:-true}
      - DOCUMENT_NORMALIZATION_ENABLED=${DOCUMENT_NORMALIZATION_ENABLED:-true}
    volumes:
      - ./backend:/app
      - backend_venv:/app/venv
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - clinic-network
    command: python workers.py

  # Frontend - React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: clinic-frontend
    restart: unless-stopped
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - clinic-network
    command: npm run dev -- --host 0.0.0.0

  # PostgreSQL - Chatwoot Database (with pgvector extension)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: clinic-chatwoot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${CHATWOOT_DB_NAME:-chatwoot_production}
      POSTGRES_USER: ${CHATWOOT_DB_USER:-chatwoot}
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwootpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chatwoot - Customer Support Platform
  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: clinic-chatwoot
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE:-replace-with-long-random-string}
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL:-http://localhost:3001}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${CHATWOOT_DB_NAME:-chatwoot_production}
      - POSTGRES_USERNAME=${CHATWOOT_DB_USER:-chatwoot}
      - POSTGRES_PASSWORD=${CHATWOOT_DB_PASSWORD:-chatwootpass}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ACTIVE_STORAGE_SERVICE=local
      - RAILS_LOG_TO_STDOUT=true
      - USE_INBOX_AVATAR_FOR_BOT=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot_data:/app/storage
    networks:
      - clinic-network
    command: bundle exec rails server -b 0.0.0.0 -p 3000

  # Chatwoot Sidekiq - Background Jobs
  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: clinic-chatwoot-sidekiq
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE:-replace-with-long-random-string}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${CHATWOOT_DB_NAME:-chatwoot_production}
      - POSTGRES_USERNAME=${CHATWOOT_DB_USER:-chatwoot}
      - POSTGRES_PASSWORD=${CHATWOOT_DB_PASSWORD:-chatwootpass}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ACTIVE_STORAGE_SERVICE=local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot_data:/app/storage
    networks:
      - clinic-network
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  mongodb_data:
    name: clinic-mongodb-data
  redis_data:
    name: clinic-redis-data
  backend_venv:
    name: clinic-backend-venv
  frontend_node_modules:
    name: clinic-frontend-node-modules
  minio_data:
    name: clinic-minio-data
  postgres_data:
    name: clinic-chatwoot-postgres-data
  chatwoot_data:
    name: clinic-chatwoot-data

networks:
  clinic-network:
    name: clinic-network
    driver: bridge
