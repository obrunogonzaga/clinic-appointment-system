version: "3.9"

services:
  pdf-extractor:
    build: ./extractor
    container_name: pdf-extractor
    ports:
      - "8000:8000"
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: n8n-postgres
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - n8n_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.61.1
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_LOG_LEVEL: info
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      GENERIC_TIMEZONE: America/Sao_Paulo
      EXTRACTOR_URL: http://pdf-extractor:8000
    depends_on:
      - postgres
      - pdf-extractor
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./input_pdfs:/data/input_pdfs
      - ./output:/data/output
    restart: unless-stopped

volumes:
  n8n_postgres:
