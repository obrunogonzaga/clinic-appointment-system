services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: clinic-lab-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data_lab:/data/db
      - ./scripts/mongo-init-lab.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - clinic-lab-internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis - Cache and Task Queue
  redis:
    image: redis:7-alpine
    container_name: clinic-lab-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_lab:/data
    networks:
      - clinic-lab-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  # MinIO - S3-compatible Storage
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: clinic-lab-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_lab:/data
    networks:
      - clinic-lab-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO Setup - Create bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: clinic-lab-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    networks:
      - clinic-lab-internal
    entrypoint: /bin/sh
    command: -c "
      set -euo pipefail;
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'Aguardando MinIO iniciar...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET_NAME};
      echo 'Bucket $${MINIO_BUCKET_NAME} criado com sucesso!';"

  # Backend API - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: clinic-lab-backend
    restart: always
    expose:
      - "8000"
    environment:
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/
      - DATABASE_NAME=${MONGO_INITDB_DATABASE}
      - SECRET_KEY=${BACKEND_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=staging
      - DEBUG=False
      - CORS_ORIGINS=${CORS_ORIGINS}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - ADDRESS_NORMALIZATION_ENABLED=${ADDRESS_NORMALIZATION_ENABLED:-true}
      - DOCUMENT_NORMALIZATION_ENABLED=${DOCUMENT_NORMALIZATION_ENABLED:-true}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - clinic-lab-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Worker - ARQ Background Tasks
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: clinic-lab-worker
    restart: always
    command: python workers.py
    environment:
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/
      - DATABASE_NAME=${MONGO_INITDB_DATABASE}
      - SECRET_KEY=${BACKEND_SECRET_KEY}
      - ENVIRONMENT=staging
      - DEBUG=False
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - ADDRESS_NORMALIZATION_ENABLED=${ADDRESS_NORMALIZATION_ENABLED:-true}
      - DOCUMENT_NORMALIZATION_ENABLED=${DOCUMENT_NORMALIZATION_ENABLED:-true}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - clinic-lab-internal

  # Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: clinic-lab-frontend
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
      - API_URL=https://clinic-lab.widia.io
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clinic-lab-internal
      - proxy
    labels:
      - "traefik.enable=true"
      # Router para HTTPS
      - "traefik.http.routers.clinic-lab.rule=Host(`clinic-lab.widia.io`)"
      - "traefik.http.routers.clinic-lab.entrypoints=websecure"
      - "traefik.http.routers.clinic-lab.tls.certresolver=letsencrypt"
      # Service
      - "traefik.http.services.clinic-lab.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mongodb_data_lab:
    name: clinic-lab-mongodb-data
  redis_data_lab:
    name: clinic-lab-redis-data
  minio_data_lab:
    name: clinic-lab-minio-data

networks:
  clinic-lab-internal:
    name: clinic-lab-internal
    driver: bridge
  proxy:
    external: true
